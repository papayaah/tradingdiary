services:
  web:
    container_name: ${APP_NAME:-tradingdiary}
    build:
      context: .
      target: runner
      args:
        # Inlined into the client bundle at build time. Must also be set in the
        # server .env so this interpolation resolves during `docker compose build`.
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
        NEXT_PUBLIC_CRYPTO_MARKET_DATA_ENABLED: ${NEXT_PUBLIC_CRYPTO_MARKET_DATA_ENABLED:-false}
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      MEDIA_STORAGE_PATH: /srv/tradingdiary/media
      DATABASE_URL: ${DATABASE_URL}
      # BullMQ/shared-cache Redis. The admin observability routes (queues/cache/
      # governor) and any shared-cache access open a client; without this they
      # fall back to the code default redis://127.0.0.1:6379, which inside this
      # container is itself → ECONNREFUSED. Same service the scanner uses.
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_GEMINI_API_KEY: ${GOOGLE_GEMINI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      AI_HOSTED_DAILY_CREDIT_CAP: ${AI_HOSTED_DAILY_CREDIT_CAP:-5000}
      AI_GUEST_CREDITS: ${AI_GUEST_CREDITS:-5}
      AI_USER_MONTHLY_CREDITS: ${AI_USER_MONTHLY_CREDITS:-50}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_WATCHLIST_LIMIT: ${ADMIN_WATCHLIST_LIMIT:-500}
      POLYGON_API_KEY: ${POLYGON_API_KEY}
      TIINGO_API_KEY: ${TIINGO_API_KEY:-}
      EQUITIES_PROVIDER: ${EQUITIES_PROVIDER:-auto}
      # Encrypts user-owned IBKR Flex tokens at rest. Must be identical in the
      # web and scanner containers and remain stable across deploys.
      IBKR_FLEX_ENCRYPTION_KEY: ${IBKR_FLEX_ENCRYPTION_KEY}
      # Server-side historical FX conversion. Keep this out of client bundles.
      EXCHANGE_RATE_API_KEY: ${EXCHANGE_RATE_API_KEY:-}
      # IBKR gateway for the browser chart's /api/watch futures fetches. Uses a
      # DISTINCT clientId from the scanner (default 7) so the two connections
      # don't collide on the gateway. Reached over the shared ibkr-net network.
      IBKR_GATEWAY_HOST: ${IBKR_GATEWAY_HOST:-ib-gateway}
      IBKR_GATEWAY_PORT: ${IBKR_GATEWAY_PORT:-4003}
      IBKR_CLIENT_ID: ${IBKR_WEB_CLIENT_ID:-8}
      # Web Push. The web process does not currently send push, but keep the keys
      # symmetric with the scanner so a future route handler cannot fail silently.
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      NEXT_PUBLIC_CRYPTO_MARKET_DATA_ENABLED: ${NEXT_PUBLIC_CRYPTO_MARKET_DATA_ENABLED:-false}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - media_storage:/srv/tradingdiary/media
    networks:
      - default
      - ibkr-net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tradingdiary}
      POSTGRES_USER: ${POSTGRES_USER:-tradingdiary}
      # Required. Set in .env (server) or .env.local (dev). Do not commit secrets.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:25432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Redis backs BullMQ (queue, scheduling, retries). Internal to the compose
  # network only — no published host port — so it cannot clash with or be
  # reached from outside this project. Default maxmemory-policy is noeviction.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  # Long-lived market scanner worker (separate from web so a web restart never
  # spawns duplicate loops). Defaults to shadow mode: scans and persists state
  # but creates no user-visible alerts until SCANNER_SHADOW=false.
  scanner:
    container_name: ${APP_NAME:-tradingdiary}-scanner
    build:
      context: .
      target: scanner
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      SCANNER_SHADOW: ${SCANNER_SHADOW:-true}
      SCANNER_WORKER_ID: ${SCANNER_WORKER_ID:-scanner-1}
      # Adaptive shared-acquisition cadence. Defaults model Tiingo Power limits
      # with 20% reserved for retries, manual requests, and estimation error.
      SCANNER_GOVERNOR: ${SCANNER_GOVERNOR:-true}
      SCANNER_BUDGET_HOURLY: ${SCANNER_BUDGET_HOURLY:-10000}
      SCANNER_BUDGET_DAILY: ${SCANNER_BUDGET_DAILY:-100000}
      SCANNER_BUDGET_MONTHLY_BYTES: ${SCANNER_BUDGET_MONTHLY_BYTES:-40000000000}
      SCANNER_BUDGET_HEADROOM: ${SCANNER_BUDGET_HEADROOM:-0.95}
      SCANNER_BUDGET_FLOOR_SECONDS: ${SCANNER_BUDGET_FLOOR_SECONDS:-15}
      SCANNER_ESTIMATED_BYTES_PER_BAR: ${SCANNER_ESTIMATED_BYTES_PER_BAR:-110}
      SCANNER_PROVIDER_BUDGETS: ${SCANNER_PROVIDER_BUDGETS:-}
      POLYGON_API_KEY: ${POLYGON_API_KEY:-}
      TIINGO_API_KEY: ${TIINGO_API_KEY:-}
      EQUITIES_PROVIDER: ${EQUITIES_PROVIDER:-auto}
      IBKR_FLEX_ENCRYPTION_KEY: ${IBKR_FLEX_ENCRYPTION_KEY}
      IBKR_FLEX_DAILY_HOUR_ET: ${IBKR_FLEX_DAILY_HOUR_ET:-6}
      IBKR_FLEX_SYNC_BATCH_SIZE: ${IBKR_FLEX_SYNC_BATCH_SIZE:-10}
      IBKR_FLEX_SCHEDULER_TICK_MS: ${IBKR_FLEX_SCHEDULER_TICK_MS:-60000}
      # IBKR Gateway (CME futures) — reached over the shared external network, not
      # a host port. 4003 is the container-internal socat bridge for the LIVE API
      # (4001 is the gateway's own loopback bind; 4003 is what other containers use).
      # The gateway runs as a SEPARATE compose project (docker-compose.ibkr.server.yml)
      # so app deploys never restart it. Unset these to disable IBKR routing.
      IBKR_GATEWAY_HOST: ${IBKR_GATEWAY_HOST:-ib-gateway}
      IBKR_GATEWAY_PORT: ${IBKR_GATEWAY_PORT:-4003}
      # Web Push: the scanner is the process that actually sends push, so it needs
      # both keys at runtime (read from process.env by lib/scanner/push.ts).
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      NEXT_PUBLIC_CRYPTO_MARKET_DATA_ENABLED: ${NEXT_PUBLIC_CRYPTO_MARKET_DATA_ENABLED:-false}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:support@tradingdiary.app}
    networks:
      # default: reach postgres/redis. ibkr-net: reach the gateway project.
      - default
      - ibkr-net

networks:
  # Shared with the IBKR gateway's separate compose project. Created once on the
  # server: `docker network create tradingdiary-ibkr-net`. external:true means
  # compose attaches to it but never creates/removes it, so the gateway's
  # lifecycle stays fully decoupled from app deploys.
  ibkr-net:
    external: true
    name: tradingdiary-ibkr-net

volumes:
  pgdata:
  media_storage:
  redis_data:
